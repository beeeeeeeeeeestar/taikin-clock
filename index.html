<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#50305e">
  <meta name="color-scheme" content="light">
  <meta name="description" content="始業時刻から退勤予定や勤務時間を切り替えて計算できる電卓。休憩込み。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>退勤じかん電卓</title>
  <style>
    :root {font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP','Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#432945;background:#fdf8fc;}
    *{box-sizing:border-box;}
    html{min-height:100%;}
    body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 90% 5%,#ffe0f1 0,transparent 48%),radial-gradient(ellipse at 2% 95%,#eadbff 0,transparent 48%),#fdf8fc;}
    main{width:min(100%,480px);min-height:100svh;margin:auto;padding:max(24px,env(safe-area-inset-top)) 21px max(30px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:20px;}
    .brand{display:flex;align-items:center;gap:13px;}
    .brand-mark{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#f7b4db,#cba2f6);box-shadow:0 8px 19px #b27dc532;font-size:27px;flex-shrink:0;}
    h1{font-size:clamp(24px,7vw,30px);line-height:1.2;margin:0;letter-spacing:.02em;font-weight:850;}
    .subtitle{color:#8f718e;font-size:12px;margin:5px 0 0;font-weight:650;letter-spacing:.03em;}
    .paper{background:#ffffffeb;border:1px solid #f1ddea;border-radius:26px;padding:22px 20px;box-shadow:0 16px 38px #aa71911b;}
    .switch-label{font-weight:800;font-size:14px;margin:0 0 10px;color:#674368;}
    .switcher{display:grid;grid-template-columns:1fr 1fr;background:#f5e8f3;border-radius:16px;padding:5px;gap:4px;margin-bottom:23px;}
    .mode{border:0;border-radius:12px;background:transparent;color:#7d6281;font-weight:800;font-size:13px;min-height:48px;padding:7px 4px;cursor:pointer;touch-action:manipulation;}
    .mode[aria-pressed="true"]{background:white;color:#7b4380;box-shadow:0 3px 12px #82588224;}
    .mode:focus-visible,.copy:focus-visible,.reset:focus-visible{outline:3px solid #a86cc3;outline-offset:3px;}
    .field+.field{margin-top:21px;}
    label{display:block;font-weight:800;font-size:15px;margin-bottom:9px;}
    .hint{font-size:12px;color:#896c86;font-weight:500;margin-left:7px;}
    .input-row{display:flex;gap:9px;align-items:center;}
    input{display:block;min-width:0;width:100%;height:66px;background:#fdf8fc;border:2px solid #ead5e7;border-radius:16px;padding:0 17px;color:#4e2c58;font:800 31px/1 -apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;letter-spacing:.02em;font-variant-numeric:tabular-nums;outline:none;caret-color:#a24689;}
    input:focus{border-color:#ac70c5;box-shadow:0 0 0 4px #b787e520;}
    .unit{flex:0 0 auto;min-width:30px;color:#886985;font-weight:700;font-size:13px;}
    .interpreted{min-height:19px;margin:8px 0 0;font-size:12px;color:#8e6b89;}
    .result{color:white;background:linear-gradient(135deg,#6b3c7a,#bd589b 78%,#dc7fae);border-radius:27px;padding:28px 18px 22px;box-shadow:0 18px 38px #924e7a3a;text-align:center;}
    .result-label{font-size:14px;letter-spacing:.1em;font-weight:750;color:#f8e4f4;}
    .clock{font-size:clamp(59px,17vw,82px);font-weight:850;line-height:1.2;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin:11px 0 5px;overflow-wrap:anywhere;}
    .clock.hours{font-size:clamp(40px,11vw,59px);letter-spacing:-.035em;}
    .plain{font-size:14px;color:#f9e4f3;min-height:22px;line-height:1.5;}
    .copy{display:flex;align-items:center;justify-content:center;gap:8px;margin:19px auto 0;border:0;min-height:46px;width:min(100%,230px);border-radius:24px;background:white;color:#7a417d;font-size:14px;font-weight:850;cursor:pointer;touch-action:manipulation;}
    .copy:active{transform:translateY(1px);}
    .copy:disabled{opacity:.45;cursor:default;}
    .foot{color:#967f96;font-size:12px;line-height:1.8;margin:0 2px;}
    .foot strong{color:#6d4c72;}
    .reset{align-self:center;border:0;background:none;color:#956b90;font-size:13px;text-decoration:underline;text-underline-offset:4px;padding:4px;cursor:pointer;}
    .error{color:#ffebef;font-weight:700;font-size:13px;}
    @media(max-height:610px) and (orientation:landscape){main{max-width:570px;gap:12px;padding-top:14px;padding-bottom:14px;}.paper{padding:15px;}.switcher{margin-bottom:11px;}.mode{min-height:40px;}.field+.field{margin-top:11px;}input{height:48px;font-size:26px;}.result{padding:15px;}.clock{font-size:54px;margin:0;}.clock.hours{font-size:42px;}.copy{min-height:40px;margin-top:6px;}.brand-mark{height:40px;width:40px;}h1{font-size:22px;}}
    @media(prefers-reduced-motion:no-preference){.copy,.mode{transition:transform .12s ease,background-color .15s ease;}}
  </style>
</head>
<body>
<main>
  <header class="brand">
    <div class="brand-mark" aria-hidden="true">✦</div>
    <div><h1>退勤じかん電卓</h1><p class="subtitle">休憩込みでサクッと計算 ♡</p></div>
  </header>
  <section class="paper" aria-label="入力">
    <p class="switch-label">計算モードを選ぶ</p>
    <div class="switcher" role="group" aria-label="計算モード">
      <button id="mode-finish" class="mode" type="button" aria-pressed="true">退勤予定を計算</button>
      <button id="mode-hours" class="mode" type="button" aria-pressed="false">勤務時間を計算</button>
    </div>
    <div class="field">
      <label for="start">始業時刻 <span class="hint">9:21 → 921</span></label>
      <div class="input-row"><input id="start" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" value="921"><span class="unit">時刻</span></div>
    </div>
    <div class="field">
      <label for="second" id="second-label">勤務時間 <span class="hint">10.5時間 → 1050</span></label>
      <div class="input-row"><input id="second" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="1050" aria-describedby="second-hint"><span class="unit" id="second-unit">時間</span></div>
      <div id="second-hint" class="interpreted" aria-live="polite">10.5時間 ＝ 10時間30分</div>
    </div>
  </section>
  <section class="result" aria-live="polite" aria-label="計算結果">
    <div class="result-label" id="result-label">退勤予定時刻</div>
    <div id="clock" class="clock">19:51</div>
    <div id="raw" class="plain">電卓式：1951</div>
    <button id="copy" class="copy" type="button">⌁&nbsp; 結果をコピー</button>
  </section>
  <p class="foot"><strong>入力ルール：</strong>勤務時間の「1050」は10時間50分ではなく、<strong>10.50時間（＝10時間30分）</strong>として計算するわよ。<br>※休憩を引かない「休憩込みの拘束時間」の計算よ。実働時間ではないので注意してね。</p>
  <button class="reset" type="button" id="reset">入力を初期値に戻す</button>
</main>
<script>
(function(){
  'use strict';
  const startEl=document.getElementById('start');
  const secondEl=document.getElementById('second');
  const clockEl=document.getElementById('clock');
  const rawEl=document.getElementById('raw');
  const detailEl=document.getElementById('second-hint');
  const labelEl=document.getElementById('second-label');
  const unitEl=document.getElementById('second-unit');
  const resultLabelEl=document.getElementById('result-label');
  const finishBtn=document.getElementById('mode-finish');
  const hoursBtn=document.getElementById('mode-hours');
  const copyBtn=document.getElementById('copy');
  const resetBtn=document.getElementById('reset');
  const defaults={start:'921',duration:'1050',end:'2021',mode:'finish'};
  const values={duration:defaults.duration,end:defaults.end};
  let mode=defaults.mode;
  const pad=v=>String(v).padStart(2,'0');
  function parseClock(raw){
    const v=raw.trim();
    if(/^\d{1,2}:\d{2}$/.test(v)){
      const [h,m]=v.split(':').map(Number);
      return h<24&&m<60?h*60+m:null;
    }
    if(!/^\d{1,4}$/.test(v))return null;
    const n=Number(v),h=Math.floor(n/100),m=n%100;
    return h<24&&m<60?h*60+m:null;
  }
  function parseHours(raw){
    const v=raw.trim();
    if(/^\d{1,4}$/.test(v))return Number(v)/100;
    if(/^\d{1,2}\.\d{1,2}$/.test(v))return Number(v);
    return null;
  }
  function save(){
    try{
      localStorage.setItem('taikin-start',startEl.value);
      localStorage.setItem('taikin-duration',values.duration); // 旧バージョンの記録も引き継ぐ
      localStorage.setItem('taikin-end',values.end);
      localStorage.setItem('taikin-mode',mode);
    }catch(e){}
  }
  function renderMode(){
    finishBtn.setAttribute('aria-pressed',String(mode==='finish'));
    hoursBtn.setAttribute('aria-pressed',String(mode==='hours'));
    if(mode==='finish'){
      labelEl.innerHTML='勤務時間 <span class="hint">10.5時間 → 1050</span>';
      unitEl.textContent='時間';
      secondEl.inputMode='decimal';
      resultLabelEl.textContent='退勤予定時刻';
      secondEl.value=values.duration;
    }else{
      labelEl.innerHTML='退勤時刻 <span class="hint">20:21 → 2021</span>';
      unitEl.textContent='時刻';
      secondEl.inputMode='numeric';
      resultLabelEl.textContent='勤務時間（休憩込み）';
      secondEl.value=values.end;
    }
    clockEl.classList.toggle('hours',mode==='hours');
    copyBtn.textContent='⌁  結果をコピー';
    recalc();
  }
  function recalc(){
    const start=parseClock(startEl.value);
    const isFinish=mode==='finish';
    const hours=isFinish?parseHours(secondEl.value):null;
    const endMin=!isFinish?parseClock(secondEl.value):null;
    let durationMin=null;
    if(isFinish){
      if(hours===null||hours>72){
        detailEl.textContent='例：1050 → 10.5時間 / 1025 → 10.25時間';
      }else{
        durationMin=Math.round(hours*60);
        detailEl.textContent=`${hours.toLocaleString('ja-JP',{maximumFractionDigits:2})}時間 ＝ ${Math.floor(durationMin/60)}時間${durationMin%60}分`;
      }
    }else{
      detailEl.textContent=endMin===null?'例：2021 → 20:21 / 1800 → 18:00':`${pad(Math.floor(endMin/60))}:${pad(endMin%60)} に退勤`;
    }
    if(start===null||(isFinish&&(hours===null||hours>72))||(!isFinish&&endMin===null)){
      clockEl.textContent=isFinish?'--:--':'--.--時間';
      rawEl.textContent='始業・'+(isFinish?'勤務時間':'退勤時刻')+'の入力を確認してね';
      rawEl.classList.add('error');
      copyBtn.disabled=true;
      copyBtn.dataset.text='';
      save();
      return;
    }
    if(isFinish){
      const end=start+durationMin, day=Math.floor(end/1440), time=end%1440;
      const stamp=`${pad(Math.floor(time/60))}:${pad(time%60)}`;
      clockEl.textContent=stamp;
      rawEl.textContent=`電卓式：${pad(Math.floor(time/60))}${pad(time%60)}${day>0?'（翌日'+(day>1?'以降':'')+'）':''}`;
      copyBtn.dataset.text=stamp;
    }else{
      // 退勤が始業より早い場合は翌日退勤として扱う。
      const minutes=(endMin-start+1440)%1440;
      const decimal=(Math.round(minutes/60*100)/100).toFixed(2);
      const plain=String(Math.round(minutes/60*100));
      clockEl.textContent=`${decimal}時間`;
      rawEl.textContent=`${Math.floor(minutes/60)}時間${minutes%60}分 ｜ 電卓式：${plain}${endMin<start?'（翌日退勤）':''}`;
      copyBtn.dataset.text=plain;
    }
    rawEl.classList.remove('error');
    copyBtn.disabled=false;
    save();
  }
  try{
    const savedStart=localStorage.getItem('taikin-start');
    const savedDuration=localStorage.getItem('taikin-duration');
    const savedEnd=localStorage.getItem('taikin-end');
    const savedMode=localStorage.getItem('taikin-mode');
    if(savedStart!==null)startEl.value=savedStart;
    if(savedDuration!==null)values.duration=savedDuration;
    if(savedEnd!==null)values.end=savedEnd;
    if(savedMode==='finish'||savedMode==='hours')mode=savedMode;
  }catch(e){}
  startEl.addEventListener('input',recalc);
  secondEl.addEventListener('input',()=>{values[mode==='finish'?'duration':'end']=secondEl.value;recalc();});
  startEl.addEventListener('focus',()=>startEl.select());
  secondEl.addEventListener('focus',()=>secondEl.select());
  finishBtn.addEventListener('click',()=>{if(mode!=='finish'){mode='finish';renderMode();}});
  hoursBtn.addEventListener('click',()=>{if(mode!=='hours'){mode='hours';renderMode();}});
  copyBtn.addEventListener('click',async()=>{
    const text=copyBtn.dataset.text;
    if(!text)return;
    try{
      if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);}
      else{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');document.body.removeChild(t);if(!ok)throw new Error('copy unsupported');}
      copyBtn.textContent='✓ コピーしたわ！';
      setTimeout(()=>{copyBtn.textContent='⌁  結果をコピー';},1500);
    }catch(e){copyBtn.textContent='コピーできない環境みたい';setTimeout(()=>{copyBtn.textContent='⌁  結果をコピー';},1800);}
  });
  resetBtn.addEventListener('click',()=>{
    startEl.value=defaults.start;
    values.duration=defaults.duration;
    values.end=defaults.end;
    renderMode();
  });
  renderMode();
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
})();
</script>
</body>
</html>
